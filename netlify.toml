[build]
  command = "bash ci/build-command-v2-cloudinary.sh && bash ci/install-smart-names-bar-loader.sh && bash ci/install-command-refresh.sh && mkdir -p .build-src/letmefly_app/dist/.well-known && cp android-twa/site/assetlinks.json .build-src/letmefly_app/dist/.well-known/assetlinks.json"
  publish = ".build-src/letmefly_app/dist"

[build.environment]
  NODE_VERSION = "22.12.0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/refresh.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/refresh.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://dvdooeipptaqelvlaept.supabase.co wss://dvdooeipptaqelvlaept.supabase.co; worker-src 'self' blob:; manifest-src 'self'"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
