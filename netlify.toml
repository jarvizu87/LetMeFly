[build]
  command = "set -euo pipefail && ARCHIVE='source/LETMEFLY_REBUILT_SOURCE_V5_4_UI_COMMAND_B4.zip' && test -f \"$ARCHIVE\" && test \"$(stat -c%s \"$ARCHIVE\")\" = '154947' && echo '514c538a9442d5c12c534a914f79c7f1988f2a416077b72bc5e9fafbd4ef89d4  source/LETMEFLY_REBUILT_SOURCE_V5_4_UI_COMMAND_B4.zip' | sha256sum -c - && unzip -tq \"$ARCHIVE\" && rm -rf .build-src && mkdir -p .build-src && unzip -q \"$ARCHIVE\" -d .build-src && cd .build-src/letmefly_app && sha256sum -c MANIFEST.sha256 && npm install --no-audit --no-fund && npm run audit:source && npm run audit:crownforge && npm run audit:exercise-library && npm run audit:ui && npm run typecheck && npm run build"
  publish = ".build-src/letmefly_app/dist"

[build.environment]
  NODE_VERSION = "22.12.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://dvdooeipptaqelvlaept.supabase.co wss://dvdooeipptaqelvlaept.supabase.co; worker-src 'self' blob:; manifest-src 'self'"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
