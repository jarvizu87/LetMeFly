name: LetMeFly Approved Home Option 1 Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-option1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Build isolated Home UI lane
        run: |
          bash ci/build-command-v2-v2-1.sh
          # Match the production pipeline's canonical HTML-shell normalization
          # before later additive UI installers inspect dist/index.html.
          bash ci/install-smart-names-bar-loader.sh
          bash ci/install-strength-maxes-v1.sh
          bash ci/install-progress-dashboard-v1.sh
          bash ci/install-mobile-recording-regression-v1.sh
          bash ci/install-home-command-hero-v1.sh
          bash ci/install-home-reference-v3.sh
          bash ci/install-home-progress-route-isolation-v1.sh
          bash ci/install-home-main-option1-v1.sh
          bash ci/install-profile-v2.sh
          bash ci/install-official-brand-v2.sh

      - name: Install browser audit dependency
        run: |
          cd .build-src/letmefly_app
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0

      - name: Audit approved Option 1 Home on mobile
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .build-src/letmefly_app/dist >/tmp/letmefly-home-option1-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node ci/audit-home-main-option1.mjs

      - name: Publish Home Option 1 QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: letmefly-home-option1-audit
          path: .build-src/letmefly_app/BROWSER_SMOKE_AUDIT/home-option1
          if-no-files-found: warn
          retention-days: 14
