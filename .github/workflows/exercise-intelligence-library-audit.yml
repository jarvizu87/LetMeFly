name: Exercise Intelligence Full Catalog Audit

on:
  push:
    branches: [main]
    paths:
      - 'overlays/exercise-intelligence/runtime/exercise-intelligence-library-v1.js'
      - 'overlays/exercise-intelligence/runtime/exercise-intelligence-library-v1.css'
      - 'overlays/exercise-intelligence/black-crown-v2-1-supplement.json'
      - 'overlays/exercise-intelligence/active-program-coverage-supplement-v1.json'
      - 'overlays/exercise-intelligence/program-name-coverage-supplement-v1.json'
      - 'ci/install-exercise-intelligence-library-v1.sh'
      - 'ci/install-exercise-intelligence-v2-supplement.sh'
      - 'ci/install-exercise-intelligence-active-program-coverage-v1.sh'
      - 'ci/install-exercise-intelligence-program-name-coverage-v1.sh'
      - 'ci/audit-exercise-intelligence-library-production-v1.sh'
      - '.github/workflows/exercise-intelligence-library-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'overlays/exercise-intelligence/runtime/exercise-intelligence-library-v1.js'
      - 'overlays/exercise-intelligence/runtime/exercise-intelligence-library-v1.css'
      - 'overlays/exercise-intelligence/black-crown-v2-1-supplement.json'
      - 'overlays/exercise-intelligence/active-program-coverage-supplement-v1.json'
      - 'overlays/exercise-intelligence/program-name-coverage-supplement-v1.json'
      - 'ci/install-exercise-intelligence-library-v1.sh'
      - 'ci/install-exercise-intelligence-v2-supplement.sh'
      - 'ci/install-exercise-intelligence-active-program-coverage-v1.sh'
      - 'ci/install-exercise-intelligence-program-name-coverage-v1.sh'
      - 'ci/audit-exercise-intelligence-library-production-v1.sh'
      - '.github/workflows/exercise-intelligence-library-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Audit catalog enhancer source boundary
        run: |
          set -euo pipefail
          JS='overlays/exercise-intelligence/runtime/exercise-intelligence-library-v1.js'
          CSS='overlays/exercise-intelligence/runtime/exercise-intelligence-library-v1.css'
          node --check "$JS"
          bash -n ci/install-exercise-intelligence-library-v1.sh
          bash -n ci/install-exercise-intelligence-active-program-coverage-v1.sh
          bash -n ci/install-exercise-intelligence-program-name-coverage-v1.sh
          bash -n ci/audit-exercise-intelligence-library-production-v1.sh
          test -s "$CSS"
          grep -Fq 'FULL GOVERNED CATALOG' "$JS"
          grep -Fq 'getAllExercises' "$JS"
          grep -Fq 'getSubstitutions' "$JS"
          grep -Fq 'data-lmf-intel-added' "$JS"
          grep -Fq 'data-lmf-intel-watch' "$JS"
          ! grep -Fq 'localStorage' "$JS"
          ! grep -Fq 'sessionStorage' "$JS"
          ! grep -Fq 'indexedDB' "$JS"
          ! grep -Fq 'fetch(' "$JS"
          ! grep -Fq 'data-action="apply' "$JS"
          echo 'Exercise Intelligence full catalog source boundary: PASS'

      - name: Smoke-test full catalog installer at final 112 records
        run: |
          set -euo pipefail
          TEST_DIST="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIST"' EXIT
          mkdir -p "$TEST_DIST/data" "$TEST_DIST/ui"
          cat > "$TEST_DIST/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
            <head><meta charset="utf-8"><title>LMF catalog installer smoke test</title></head>
            <body>
              <div id="app"></div>
              <script defer src="/ui/exercise-intelligence-runtime-v1.js"></script>
            </body>
          </html>
          HTML
          cat > "$TEST_DIST/service-worker.js" <<'JS'
          const CACHE_NAME = 'lmf-catalog-smoke-test'
          const PRECACHE = ['/', '/manifest.webmanifest', '/data/exercise-intelligence-v1.json', '/ui/exercise-intelligence-runtime-v1.js']
          function isPrivateOrAuth(request) {
            const url = new URL(request.url)
            if (url.hostname.endsWith('.supabase.co')) return true
            if (/\/auth\/v1\//.test(url.pathname)) return true
            return false
          }
          JS
          TEST_DATA="$TEST_DIST/data/exercise-intelligence-v1.json" node - <<'NODE'
          const fs = require('fs');
          const exercises = Array.from({length:108}, (_, i) => ({
            id:`smoke-${i+1}`,
            canonicalName:`Smoke Exercise ${i+1}`,
            aliases:[],
            movementRoles:['Smoke'],
            trainingCategory:'Smoke',
            purpose:'Smoke-test record',
            coachingCues:['Smoke cue'],
            commonMistakes:['Smoke mistake'],
            reviewStatus:'READY FOR REVIEW',
            demo:{currentStatus:'search-fallback',currentUrl:'https://www.youtube.com/results?search_query=smoke',candidateRequiresValidation:false},
            thumbnail:{canonicalKey:`smoke-${i+1}`},
          }));
          const substitutionRules = Array.from({length:27}, (_, i) => ({id:`smoke-rule-${i+1}`}));
          const payload = {
            schemaVersion:'1.2-active-program-coverage',
            integrationStatus:'READY_FOR_NON_PRESCRIPTION_APP_INTEGRATION',
            counts:{exercises:108,substitutionRules:27,roleCoverage:108,coachingCoverage:108,readyForReview:108},
            activeProgramCoverageSupplements:['active-program-coverage-v1'],
            compoundProgramDisplayNames:[
              'Bike / Incline Walk','Bike / Row / Walk','Bike / Walk','Bike or Walk','Walk or Bike',
              'Dead Bug or Hollow Hold','Front Squat + Bench Ramp Sets',
              'KB Lateral Clean or Outside Swing to Rack','Pull-Up or Lat Pulldown',
              'Reverse Crunch or Dead Bug','Wide or Neutral Pulldown','Curl','Pushdown'
            ],
            exercises,
            substitutionRules,
          };
          fs.writeFileSync(process.env.TEST_DATA, JSON.stringify(payload));
          NODE
          printf '%s\n' 'window.LetMeFlyExerciseIntelligence = Object.freeze({}); // 92/25 94/27 108/27 112/27' > "$TEST_DIST/ui/exercise-intelligence-runtime-v1.js"
          bash ci/install-exercise-intelligence-program-name-coverage-v1.sh "$TEST_DIST"
          bash ci/install-exercise-intelligence-library-v1.sh "$TEST_DIST"
          test -f "$TEST_DIST/ui/exercise-intelligence-library-v1.js"
          test -f "$TEST_DIST/ui/exercise-intelligence-library-v1.css"
          grep -Fq '/ui/exercise-intelligence-library-v1.js' "$TEST_DIST/index.html"
          grep -Fq '/ui/exercise-intelligence-library-v1.css' "$TEST_DIST/index.html"
          grep -Fq "'/ui/exercise-intelligence-library-v1.js'" "$TEST_DIST/service-worker.js"
          grep -Fq "'/ui/exercise-intelligence-library-v1.css'" "$TEST_DIST/service-worker.js"
          TEST_DATA="$TEST_DIST/data/exercise-intelligence-v1.json" node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.env.TEST_DATA, 'utf8'));
          if (payload.schemaVersion !== '1.3-program-name-coverage') throw new Error('final smoke schema mismatch');
          if (payload.counts?.exercises !== 112 || payload.counts?.substitutionRules !== 27) throw new Error('final smoke counts mismatch');
          if ((payload.compoundProgramDisplayNames || []).length !== 20) throw new Error('choice label count mismatch');
          if ((payload.programControlDisplayNames || []).length !== 7) throw new Error('control/rest label count mismatch');
          console.log('Exercise Intelligence full catalog installer smoke test: PASS (112/27)');
          NODE
