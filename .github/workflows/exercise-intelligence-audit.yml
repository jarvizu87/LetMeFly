name: Exercise Intelligence Audit

on:
  push:
    branches: [main]
    paths:
      - 'overlays/exercise-intelligence/**'
      - 'ci/verify-exercise-intelligence.sh'
      - 'ci/install-exercise-intelligence-v1.sh'
      - 'ci/install-exercise-intelligence-active-program-coverage-v1.sh'
      - '.github/workflows/exercise-intelligence-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'overlays/exercise-intelligence/**'
      - 'ci/verify-exercise-intelligence.sh'
      - 'ci/install-exercise-intelligence-v1.sh'
      - 'ci/install-exercise-intelligence-active-program-coverage-v1.sh'
      - '.github/workflows/exercise-intelligence-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Verify Exercise Intelligence payload
        run: bash ci/verify-exercise-intelligence.sh

      - name: Audit read-only runtime sources
        run: |
          node --check overlays/exercise-intelligence/runtime/exercise-intelligence-runtime-v1.js
          node --check overlays/exercise-intelligence/runtime/exercise-intelligence-ui-v1.js
          bash -n ci/verify-exercise-intelligence.sh
          bash -n ci/install-exercise-intelligence-v1.sh
          bash -n ci/install-exercise-intelligence-active-program-coverage-v1.sh
          grep -Fq 'program-packages-only' overlays/exercise-intelligence/runtime/exercise-intelligence-runtime-v1.js
          grep -Fq '108/27' overlays/exercise-intelligence/runtime/exercise-intelligence-runtime-v1.js
          grep -Fq 'data-exercise-info' overlays/exercise-intelligence/runtime/exercise-intelligence-ui-v1.js
          grep -Fq 'PROGRAM SAFETY' overlays/exercise-intelligence/runtime/exercise-intelligence-ui-v1.js
          grep -Fq '.lmf-intel-modal' overlays/exercise-intelligence/runtime/exercise-intelligence-ui-v1.css
          ! grep -Fq 'data-substitute' overlays/exercise-intelligence/runtime/exercise-intelligence-ui-v1.js
          ! grep -Fq 'localStorage' overlays/exercise-intelligence/runtime/exercise-intelligence-ui-v1.js
          ! grep -Fq 'sessionStorage' overlays/exercise-intelligence/runtime/exercise-intelligence-ui-v1.js
          echo 'Exercise Intelligence read-only runtime audit: PASS'

      - name: Inspect active-program coverage supplement contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const supplement = JSON.parse(fs.readFileSync('overlays/exercise-intelligence/active-program-coverage-supplement-v1.json', 'utf8'));
          if (supplement.baseSchemaVersion !== '1.1-black-crown-v2-1') throw new Error('unexpected active-program base schema');
          if (supplement.finalSchemaVersion !== '1.2-active-program-coverage') throw new Error('unexpected active-program final schema');
          if (supplement.baseCounts?.exercises !== 94 || supplement.baseCounts?.substitutionRules !== 27) throw new Error('unexpected active-program base counts');
          if (supplement.finalCounts?.exercises !== 108 || supplement.finalCounts?.substitutionRules !== 27) throw new Error('unexpected active-program final counts');
          if (!Array.isArray(supplement.exercises) || supplement.exercises.length !== 14) throw new Error('expected exactly 14 active-program exercise records');
          if (!Array.isArray(supplement.substitutionRules) || supplement.substitutionRules.length !== 0) throw new Error('active-program supplement must not add substitution rules');
          if (!Array.isArray(supplement.compoundProgramDisplayNames) || supplement.compoundProgramDisplayNames.length !== 13) throw new Error('expected exactly 13 program-owned compound labels');
          console.log('Exercise Intelligence active-program supplement source contract: PASS');
          NODE

      - name: Materialize and inspect immutable base payload
        run: |
          node overlays/exercise-intelligence/materialize.mjs --output=/tmp/exercise-intelligence-v1.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/exercise-intelligence-v1.json', 'utf8'));
          if (payload.counts.exercises !== 92) throw new Error('expected 92 exercises');
          if (payload.counts.substitutionRules !== 25) throw new Error('expected 25 substitution rules');
          if (payload.integrationStatus !== 'READY_FOR_NON_PRESCRIPTION_APP_INTEGRATION') {
            throw new Error('unexpected integration status');
          }
          if (payload.exercises.some((exercise) =>
            exercise.thumbnail && ('driveFileId' in exercise.thumbnail || 'driveUrl' in exercise.thumbnail)
          )) {
            throw new Error('private thumbnail provenance leaked into runtime payload');
          }
          const blocked = payload.substitutionRules.filter((rule) =>
            String(rule.promotionStatus || '').startsWith('DO NOT')
          );
          if (blocked.length !== 2) throw new Error('expected 2 default-blocked substitutions');
          console.log('Exercise Intelligence immutable materialized payload audit: PASS (92/25)');
          NODE

      - name: Smoke-test immutable runtime installer
        run: |
          TEST_DIST="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIST"' EXIT
          cat > "$TEST_DIST/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
            <head><meta charset="utf-8"><title>LMF installer smoke test</title></head>
            <body><div id="app"></div></body>
          </html>
          HTML
          cat > "$TEST_DIST/service-worker.js" <<'JS'
          const CACHE_NAME = 'lmf-smoke-test'
          const PRECACHE = ['/', '/manifest.webmanifest']
          function isPrivateOrAuth(request) {
            const url = new URL(request.url)
            if (url.hostname.endsWith('.supabase.co')) return true
            if (/\/auth\/v1\//.test(url.pathname)) return true
            return false
          }
          JS
          bash ci/install-exercise-intelligence-v1.sh "$TEST_DIST"
          test -f "$TEST_DIST/data/exercise-intelligence-v1.json"
          test -f "$TEST_DIST/ui/exercise-intelligence-runtime-v1.js"
          test -f "$TEST_DIST/ui/exercise-intelligence-ui-v1.js"
          test -f "$TEST_DIST/ui/exercise-intelligence-ui-v1.css"
          grep -Fq '/ui/exercise-intelligence-runtime-v1.js' "$TEST_DIST/index.html"
          grep -Fq '/ui/exercise-intelligence-ui-v1.js' "$TEST_DIST/index.html"
          grep -Fq '/ui/exercise-intelligence-ui-v1.css' "$TEST_DIST/index.html"
          grep -Fq "'/data/exercise-intelligence-v1.json'" "$TEST_DIST/service-worker.js"
          grep -Fq "'/ui/exercise-intelligence-runtime-v1.js'" "$TEST_DIST/service-worker.js"
          grep -Fq "'/ui/exercise-intelligence-ui-v1.js'" "$TEST_DIST/service-worker.js"
          grep -Fq "'/ui/exercise-intelligence-ui-v1.css'" "$TEST_DIST/service-worker.js"
          grep -Fq "hostname.endsWith('.supabase.co')" "$TEST_DIST/service-worker.js"
          echo 'Exercise Intelligence immutable installer + offline precache smoke test: PASS'
