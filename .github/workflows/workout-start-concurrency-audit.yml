name: Workout Start Concurrency Audit

on:
  workflow_dispatch:
  push:
    branches: [main, fix/issue-60-concurrent-workout-start]
    paths:
      - '.github/workflows/workout-start-concurrency-audit.yml'
      - 'ci/apply-workout-start-serialization-v1.sh'
      - 'ci/audit-workout-start-concurrency-v1.mjs'
      - 'ci/build-command-v2-v2-1.sh'
  pull_request:
    paths:
      - '.github/workflows/workout-start-concurrency-audit.yml'
      - 'ci/apply-workout-start-serialization-v1.sh'
      - 'ci/audit-workout-start-concurrency-v1.mjs'
      - 'ci/build-command-v2-v2-1.sh'

permissions:
  contents: read

jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Reconstruct source with transaction-safe workout creation
        run: |
          bash -n ci/apply-workout-start-serialization-v1.sh
          node --check ci/audit-workout-start-concurrency-v1.mjs
          bash ci/build-command-v2-v2-1.sh
          node ci/audit-workout-prescription-fidelity-v1.mjs .build-src/letmefly_app
          node ci/audit-athlete-program-progression.mjs .build-src/letmefly_app
          node ci/audit-workout-persistence-source.mjs .build-src/letmefly_app
      - name: Prove overlapping requests, real tabs, native save, restart and outbox integrity
        shell: bash
        run: |
          set -euo pipefail
          (cd .build-src/letmefly_app && npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0)
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node ci/audit-workout-start-concurrency-v1.mjs .build-src/letmefly_app
          git diff --exit-code HEAD -- .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workout-start-concurrency-${{ github.run_id }}
          path: .build-src/letmefly_app/WORKOUT_START_CONCURRENCY_AUDIT
          if-no-files-found: error
          retention-days: 14
