name: Cloud Sync Bootstrap Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: bash ci/build-command-v2-v2-1.sh

      - name: Verify opening account surfaces are in the production artifact
        run: |
          grep -Rq 'Sign in with your password' .build-src/letmefly_app/dist/assets
          grep -Rq 'Create your LetMeFly account' .build-src/letmefly_app/dist/assets
          grep -Rq 'Forgot password?' .build-src/letmefly_app/dist/assets
          grep -Rq 'CREATE LOCAL ATHLETE' .build-src/letmefly_app/dist/assets

      - name: Validate password sign-in, registration and recovery boundaries
        run: |
          node ci/audit-password-auth-v1.mjs
          node ci/audit-password-registration-v1.mjs
          node ci/audit-password-recovery-v1.mjs

      - name: Validate prepared phone sign-in without sending messages
        run: |
          bash ci/apply-phone-otp-v1.sh .build-src/letmefly_app
          npm --prefix .build-src/letmefly_app run typecheck

      - run: npm install --prefix .build-src/letmefly_app --no-save --package-lock=false --ignore-scripts fake-indexeddb@6.2.5

      - name: Audit local-first bootstrap and interrupted-sync recovery
        run: node ci/audit-cloud-bootstrap-v2.mjs .build-src/letmefly_app

      - name: Audit fresh-device profile synchronization
        run: node ci/audit-profile-cloud-sync.mjs .build-src/letmefly_app

      - name: Audit phone-desktop round-trip and simultaneous-edit conflicts
        run: node ci/audit-two-device-sync-v1.mjs .build-src/letmefly_app

      - name: Audit converged conflict recovery
        run: node ci/audit-conflict-recovery-v1.mjs .build-src/letmefly_app

      - name: Audit password-vault reconciliation and mismatch protection
        run: node ci/audit-password-vault-v1.mjs .build-src/letmefly_app

      - name: Audit installed-PWA banner suppression and dismissal persistence
        run: node ci/audit-pwa-install.mjs
