name: Cloud Sync Bootstrap Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Reconstruct exact production candidate
        run: bash ci/build-command-v2-v2-1.sh

      - name: Install isolated account/device audit dependencies
        run: npm install --prefix .build-src/letmefly_app --no-save --package-lock=false --ignore-scripts fake-indexeddb@6.2.5 playwright-core@1.55.0

      - name: Verify opening Sign In / Register / Forgot Password / local-athlete surfaces in a real browser
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .build-src/letmefly_app/dist >/tmp/letmefly-account-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node ci/audit-account-surface-browser-v1.mjs

      - name: Validate password sign-in, registration and recovery boundaries
        run: |
          node ci/audit-password-auth-v1.mjs
          node ci/audit-password-registration-v1.mjs
          node ci/audit-password-recovery-v1.mjs

      - name: Validate prepared phone sign-in without sending messages
        run: |
          bash ci/apply-phone-otp-v1.sh .build-src/letmefly_app
          npm --prefix .build-src/letmefly_app run typecheck

      - name: Audit local-first bootstrap and interrupted-sync recovery
        run: node ci/audit-cloud-bootstrap-v2.mjs .build-src/letmefly_app

      - name: Audit fresh-device profile synchronization
        run: node ci/audit-profile-cloud-sync.mjs .build-src/letmefly_app

      - name: Audit phone-desktop round-trip and simultaneous-edit conflicts
        run: node ci/audit-two-device-sync-v1.mjs .build-src/letmefly_app

      - name: Audit converged conflict recovery
        run: node ci/audit-conflict-recovery-v1.mjs .build-src/letmefly_app

      - name: Audit password-vault reconciliation and mismatch protection
        run: node ci/audit-password-vault-v1.mjs .build-src/letmefly_app

      - name: Audit installed-PWA banner suppression and dismissal persistence
        run: node ci/audit-pwa-install.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-device-sync-audit
          path: .build-src/letmefly_app/ACCOUNT_SURFACE_AUDIT
          retention-days: 7
          if-no-files-found: warn
