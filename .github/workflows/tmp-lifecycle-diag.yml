name: Temporary Lifecycle Diagnostic

on:
  push:
    branches: [hardening/exercise-intelligence-completion-v1]

permissions:
  contents: read

concurrency:
  group: tmp-lifecycle-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Assemble candidate quietly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/assembly.sh"
          import pathlib, tomllib
          print('set -euo pipefail')
          print(tomllib.loads(pathlib.Path('netlify.toml').read_text())['build']['command'])
          PY
          bash "$RUNNER_TEMP/assembly.sh" >"$RUNNER_TEMP/assembly.log" 2>&1 || { tail -120 "$RUNNER_TEMP/assembly.log"; exit 1; }
      - name: Run lifecycle audit and print concise report
        shell: bash
        run: |
          set -euo pipefail
          (cd .build-src/letmefly_app && npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0 >/dev/null 2>&1)
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .build-src/letmefly_app/dist >"$RUNNER_TEMP/ui-http.log" 2>&1 &
          UI_SERVER_PID=$!
          trap 'kill "$UI_SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          set +e
          node ci/audit-lifecycle-public-ui.mjs >/dev/null 2>&1
          CODE=$?
          set -e
          cat .build-src/letmefly_app/LIFECYCLE_PUBLIC_UI_AUDIT/report.json
          exit "$CODE"
