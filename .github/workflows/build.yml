name: LetMeFly Command UI Build Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Download audited Command UI source
        run: |
          rm -rf .build-src
          mkdir -p .build-src
          python -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1MxLfzIIruDm_JZK62GFuuWarTBWt3tiY' -O /tmp/letmefly-command-ui.zip
          echo '914cd1e9be7bfc23c4d283c92a9ea634bd3128547d4dd5f1fe8c7aa1a3de327f  /tmp/letmefly-command-ui.zip' | sha256sum -c -
          unzip -q /tmp/letmefly-command-ui.zip -d .build-src
          test -f .build-src/letmefly_app/package.json

      - name: Install dependencies
        working-directory: .build-src/letmefly_app
        run: npm install --no-audit --no-fund

      - name: Source and security audit
        working-directory: .build-src/letmefly_app
        run: npm run audit:source

      - name: Crownforge governed-source audits
        working-directory: .build-src/letmefly_app
        run: npm run audit:crownforge

      - name: Typecheck
        working-directory: .build-src/letmefly_app
        run: npm run typecheck

      - name: Production build
        working-directory: .build-src/letmefly_app
        run: npm run build

      - name: Verify production output
        run: |
          test -f .build-src/letmefly_app/dist/index.html
          test -f .build-src/letmefly_app/dist/manifest.webmanifest
          test -f .build-src/letmefly_app/dist/service-worker.js
          ! grep -R "service_role\|SUPABASE_SERVICE\|DATABASE_PASSWORD" .build-src/letmefly_app/dist
