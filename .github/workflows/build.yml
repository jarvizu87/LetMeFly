name: LetMeFly Command V2 Build Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # CI validates the build path only. Netlify injects the real browser-safe
      # Supabase URL and publishable key for production builds.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Audit real-program workout flow edge cases
        run: node ci/audit-workout-flow-edge-cases.mjs

      - name: Build and audit Command V2 + Black Crown v2.1 + private Cloudinary exercise art
        run: bash ci/build-command-v2-v2-1.sh

      - name: Audit reconstructed workout persistence source
        run: node ci/audit-workout-persistence-source.mjs .build-src/letmefly_app

      - name: Install smart names + Bar Loader
        run: bash ci/install-smart-names-bar-loader.sh

      - name: Install read-only Exercise Intelligence runtime
        run: bash ci/install-exercise-intelligence-v1.sh

      - name: Install Black Crown v2.1 Exercise Intelligence supplement
        run: bash ci/install-exercise-intelligence-v2-supplement.sh

      - name: Install active-program Exercise Intelligence coverage
        run: bash ci/install-exercise-intelligence-active-program-coverage-v1.sh

      - name: Install final program-name Exercise Intelligence coverage
        run: bash ci/install-exercise-intelligence-program-name-coverage-v1.sh

      - name: Audit governed program names against Exercise Intelligence
        run: node ci/audit-exercise-intelligence-program-name-resolution.mjs .build-src/letmefly_app

      - name: Install full governed Exercise Intelligence catalog
        run: bash ci/install-exercise-intelligence-library-v1.sh

      - name: Install Exercise Intelligence descriptive Coach
        run: bash ci/install-exercise-intelligence-coach-v1.sh

      - name: Install governed Coach substitution guidance
        run: bash ci/install-exercise-intelligence-coach-substitutions-v1.sh

      - name: Install governed Exercise Intelligence substitution viewer
        run: bash ci/install-exercise-intelligence-substitutions-v1.sh

      - name: Install smart voice-note dictation v2
        run: bash ci/install-voice-notes-v2.sh

      - name: Install Strength Maxes
        run: bash ci/install-strength-maxes-v1.sh

      - name: Install Progress dashboard
        run: bash ci/install-progress-dashboard-v1.sh

      - name: Install Progress tab scroll safety
        run: bash ci/install-progress-tab-scroll-safety-v1.sh

      - name: Install Progress Conditioning measured analytics
        run: bash ci/install-progress-conditioning-v4.sh

      - name: Install athlete-aware Progress and Coach
        run: bash ci/install-athlete-insights-v1.sh

      - name: Install saved mountain workout recaps
        run: bash ci/install-workout-recap-v1.sh

      - name: Install and validate safe refresh utility
        run: bash ci/install-command-refresh.sh

      - name: Install recording-led mobile regression fixes
        run: bash ci/install-mobile-recording-regression-v1.sh

      - name: Install Home Command Hero
        run: bash ci/install-home-command-hero-v1.sh

      - name: Install approved Home reference + official app icon
        run: bash ci/install-home-reference-v3.sh

      - name: Isolate Home and Progress route lifecycles
        run: bash ci/install-home-progress-route-isolation-v1.sh

      - name: Install approved Option 1 Home
        run: bash ci/install-home-main-option1-v1.sh

      - name: Install private athlete Profile v2
        run: bash ci/install-profile-v2.sh

      - name: Install Workout Logging v2
        run: bash ci/install-workout-logging-v2.sh

      - name: Install exact approved official brand v2
        run: bash ci/install-official-brand-v2.sh

      - name: Install adaptive desktop workspace v1
        run: bash ci/install-desktop-workspace-v1.sh

      - name: Audit official brand v2 production assets
        run: node ci/audit-official-brand-v2.mjs .build-src/letmefly_app

      - name: Audit all programs, governed days, screens, tabs, features, and full mock training cycle
        run: node ci/audit-full-app-cycle-v2.mjs .build-src/letmefly_app

      - name: Audit production UI in real mobile and desktop browsers
        run: |
          cd .build-src/letmefly_app
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
          cd ../..
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .build-src/letmefly_app/dist >/tmp/letmefly-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"

          mkdir -p .build-src/letmefly_app/BROWSER_SMOKE_AUDIT
          STATUS_LOG=.build-src/letmefly_app/BROWSER_SMOKE_AUDIT/subaudit-status.txt
          : > "$STATUS_LOG"
          BROWSER_AUDIT_FAILURES=0

          run_browser_audit() {
            local label="$1"
            shift
            local audit_log=".build-src/letmefly_app/BROWSER_SMOKE_AUDIT/${label}.log"
            echo "START ${label}" | tee -a "$STATUS_LOG"
            set +e
            CHROME_BIN="$CHROME_BIN" "$@" 2>&1 | tee "$audit_log"
            local rc=${PIPESTATUS[0]}
            set -e
            if [[ "$rc" -ne 0 ]]; then
              echo "FAIL ${label} rc=${rc}" | tee -a "$STATUS_LOG"
              BROWSER_AUDIT_FAILURES=$((BROWSER_AUDIT_FAILURES + 1))
            else
              echo "PASS ${label}" | tee -a "$STATUS_LOG"
            fi
          }

          run_browser_audit browser-smoke node ci/audit-browser-smoke.mjs
          run_browser_audit home-progress-route-isolation node ci/audit-home-progress-route-isolation.mjs
          run_browser_audit progress-tab-scroll node ci/audit-progress-tab-scroll-browser.mjs
          run_browser_audit progress-conditioning-v4 node ci/audit-progress-conditioning-v4-browser.mjs
          run_browser_audit progress-final-v4 node ci/audit-progress-final-v4-browser.mjs
          run_browser_audit home-main-option1 node ci/audit-home-main-option1.mjs
          run_browser_audit workout-mobile-scroll node ci/audit-workout-mobile-scroll-browser.mjs
          run_browser_audit workout-day3-fidelity node ci/audit-workout-day3-fidelity-browser.mjs
          run_browser_audit official-brand-browser-v2 node ci/audit-official-brand-browser-v2.mjs
          run_browser_audit desktop-workspace-v1 node ci/audit-desktop-workspace-v1.mjs
          run_browser_audit coach-decisions node ci/audit-coach-decisions-browser.mjs
          CHECK_PROGRAM_ORDER=1 run_browser_audit athlete-insights node ci/audit-athlete-insights-browser.mjs
          run_browser_audit profile-context node ci/audit-profile-context-browser.mjs
          run_browser_audit barbell-settings node ci/audit-barbell-settings-browser.mjs
          run_browser_audit exercise-art node ci/audit-exercise-art-browser.mjs
          run_browser_audit workout-recap node ci/audit-workout-recap-browser.mjs

          if [[ "$BROWSER_AUDIT_FAILURES" -ne 0 ]]; then
            echo "Browser sub-audit failures: $BROWSER_AUDIT_FAILURES"
            cat "$STATUS_LOG"
            exit 1
          fi

      - name: Audit final Exercise Intelligence production dist
        run: |
          # This legacy audit was removed from source. Purge any stale generated
          # workspace copy before the authoritative production-dist audit runs.
          rm -f ci/audit-exercise-intelligence.mjs
          test ! -e ci/audit-exercise-intelligence.mjs
          bash ci/audit-exercise-intelligence-production-v1.sh

      - name: Audit final full Exercise Intelligence catalog
        run: bash ci/audit-exercise-intelligence-library-production-v1.sh

      - name: Publish full-app audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: letmefly-full-app-cycle-audit
          path: |
            .build-src/letmefly_app/FULL_APP_CYCLE_AUDIT.json
            .build-src/letmefly_app/FULL_APP_CYCLE_AUDIT.md
            .build-src/letmefly_app/WORKOUT_PERSISTENCE_SOURCE_AUDIT.md
            .build-src/letmefly_app/EXERCISE_INTELLIGENCE_NAME_RESOLUTION_AUDIT.json
            .build-src/letmefly_app/EXERCISE_INTELLIGENCE_NAME_RESOLUTION_AUDIT.md
            .build-src/letmefly_app/OFFICIAL_BRAND_AUDIT
          if-no-files-found: warn
          retention-days: 14

      - name: Publish browser UI audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: letmefly-browser-ui-audits
          path: |
            .build-src/letmefly_app/BROWSER_SMOKE_AUDIT
            .build-src/letmefly_app/PROGRESS_CONDITIONING_V4_AUDIT
            .build-src/letmefly_app/PROGRESS_FINAL_V4_AUDIT
            .build-src/letmefly_app/COACH_DECISIONS_AUDIT
            .build-src/letmefly_app/ATHLETE_INSIGHTS_AUDIT
            .build-src/letmefly_app/PROFILE_CONTEXT_AUDIT
            .build-src/letmefly_app/EXERCISE_ART_AUDIT
            .build-src/letmefly_app/WORKOUT_RECAP_AUDIT
            .build-src/letmefly_app/WORKOUT_MOBILE_SCROLL_AUDIT
            .build-src/letmefly_app/WORKOUT_DAY3_FIDELITY_AUDIT
            .build-src/letmefly_app/OFFICIAL_BRAND_AUDIT
            .build-src/letmefly_app/DESKTOP_WORKSPACE_AUDIT
          if-no-files-found: warn
          retention-days: 14

      - name: Publish production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: letmefly-command-v2-dist
          path: .build-src/letmefly_app/dist
          if-no-files-found: error
          retention-days: 7
