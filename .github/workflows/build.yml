name: LetMeFly Build Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: source/package-lock.json

      - name: Expand rebuilt source
        run: |
          rm -rf .build-src
          mkdir -p .build-src
          unzip -q source/LETMEFLY_REBUILT_SOURCE_V5.zip -d .build-src
          test -f .build-src/letmefly_app/package.json

      - name: Install dependencies
        working-directory: .build-src/letmefly_app
        run: npm install --no-audit --no-fund

      - name: Source audit
        working-directory: .build-src/letmefly_app
        run: npm run audit:source

      - name: Typecheck
        working-directory: .build-src/letmefly_app
        run: npm run typecheck

      - name: Production build
        working-directory: .build-src/letmefly_app
        run: npm run build

      - name: Verify production output
        run: |
          test -f .build-src/letmefly_app/dist/index.html
          test -f .build-src/letmefly_app/dist/manifest.webmanifest
          test -f .build-src/letmefly_app/dist/service-worker.js
          ! grep -R "service_role\|SUPABASE_SERVICE\|DATABASE_PASSWORD" .build-src/letmefly_app/dist
