name: LetMeFly Command V2 Build Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Build and audit Command V2 + Galaxy polish
        run: bash ci/build-command-v2-polish2.sh

      - name: Install and validate safe refresh utility
        run: bash ci/install-command-refresh.sh

      - name: Publish production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: letmefly-command-v2-dist
          path: .build-src/letmefly_app/dist
          if-no-files-found: error
          retention-days: 7

      - name: Publish hardening source diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: letmefly-hardening-source
          path: |
            .build-src/letmefly_app/src/main.ts
            .build-src/letmefly_app/src/services/workout-service.ts
            .build-src/letmefly_app/src/services/readiness-service.ts
          if-no-files-found: error
          retention-days: 1
