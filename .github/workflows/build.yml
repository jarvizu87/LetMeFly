name: LetMeFly Command UI Build Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Reconstruct audited Command UI source
        run: |
          rm -rf .build-src /tmp/ui-overlay
          mkdir -p .build-src /tmp/ui-overlay
          unzip -q source/LETMEFLY_REBUILT_SOURCE_V5.zip -d .build-src
          cat patches/ui-command-v1/overlay.b64.part1 patches/ui-command-v1/overlay.b64.part2 | base64 -d > /tmp/ui-overlay.tar.gz
          echo 'ae31003681795a3966c766965654422d02aecb9eab46915ce8902d32b1f18d58  /tmp/ui-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ui-overlay.tar.gz -C /tmp/ui-overlay
          cp -a /tmp/ui-overlay/letmefly_app/. .build-src/letmefly_app/
          while IFS= read -r path; do
            [ -n "$path" ] && rm -f ".build-src/letmefly_app/$path"
          done < /tmp/ui-overlay/letmefly_app/.delete-files
          rm -f .build-src/letmefly_app/.delete-files
          test -f .build-src/letmefly_app/package.json
          cd .build-src/letmefly_app
          sha256sum -c MANIFEST.sha256

      - name: Install dependencies
        working-directory: .build-src/letmefly_app
        run: npm install --no-audit --no-fund

      - name: Source and security audit
        working-directory: .build-src/letmefly_app
        run: npm run audit:source

      - name: Crownforge governed-source audits
        working-directory: .build-src/letmefly_app
        run: npm run audit:crownforge

      - name: Typecheck
        working-directory: .build-src/letmefly_app
        run: npm run typecheck

      - name: Production build
        working-directory: .build-src/letmefly_app
        run: npm run build

      - name: Verify production output
        run: |
          test -f .build-src/letmefly_app/dist/index.html
          test -f .build-src/letmefly_app/dist/manifest.webmanifest
          test -f .build-src/letmefly_app/dist/service-worker.js
          ! grep -R "service_role\|SUPABASE_SERVICE\|DATABASE_PASSWORD" .build-src/letmefly_app/dist
