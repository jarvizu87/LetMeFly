name: LetMeFly Five-Athlete Fixture Bootstrap

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: five-athlete-fixture-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  validate-five-athletes:
    name: Validate reusable five-athlete QA setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Reconstruct governed app without deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/assembly.sh"
          import pathlib, tomllib
          print('set -euo pipefail')
          print(tomllib.loads(pathlib.Path('netlify.toml').read_text())['build']['command'])
          PY
          bash "$RUNNER_TEMP/assembly.sh"
          echo 'Five-athlete QA reconstruction completed with production deployment held.'
      - name: Install browser harness dependency only
        shell: bash
        run: |
          set -euo pipefail
          cd .build-src/letmefly_app
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Validate fixed five-athlete fixture definitions
        shell: bash
        run: |
          set -euo pipefail
          node --check ci/five-athlete-fixtures.mjs
          node --check ci/five-athlete-seed.mjs
          node --check ci/audit-five-athlete-fixture-bootstrap.mjs
          node -e "import('./ci/five-athlete-fixtures.mjs').then(m => { if (m.FIVE_ATHLETE_FIXTURES.length !== 5) process.exit(1); console.log(m.FIVE_ATHLETE_FIXTURES.map(x => x.displayName).join('\n')) })"
      - name: Seed and verify all five athletes through real private services
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node ci/audit-five-athlete-fixture-bootstrap.mjs .build-src/letmefly_app
      - name: Confirm synthetic athletes are not shipped in production bundle
        shell: bash
        run: |
          set -euo pipefail
          for marker in 'QA 01 Rook' 'QA 02 Forge' 'QA 03 Titan' 'QA 04 Metric' 'QA 05 Recovery' 'QA-ROOK-COACH-MARKER' 'QA-FORGE-COACH-MARKER' 'QA-TITAN-COACH-MARKER' 'QA-METRIC-COACH-MARKER' 'QA-RECOVERY-COACH-MARKER'; do
            if grep -R -Fq "$marker" .build-src/letmefly_app/dist; then
              echo "Synthetic QA data leaked into dist: $marker" >&2
              exit 1
            fi
          done
          echo 'Synthetic five-athlete data remains QA-only: PASS'
      - name: Publish fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-athlete-fixture-bootstrap-${{ github.run_id }}
          path: .build-src/letmefly_app/FIVE_ATHLETE_FIXTURE_BOOTSTRAP
          if-no-files-found: error
          retention-days: 14
