name: LetMeFly Android Test APK

on:
  push:
    branches: [main]
    paths:
      - 'android-twa/**'
      - '.github/workflows/android-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore test signing key
        run: |
          mkdir -p android-twa/signing
          base64 -d android-twa/signing/letmefly-test.jks.b64 > android-twa/signing/letmefly-test.jks

      - name: Fetch official LetMeFly launcher logo
        run: |
          mkdir -p android-twa/app/src/main/res/drawable-nodpi
          curl -fL 'https://res.cloudinary.com/extor5az/image/upload/v1788815215/letmefly/app-brand/letmefly-app-icon-512-v2.png' \
            -o android-twa/app/src/main/res/drawable-nodpi/letmefly_logo.png
          test -s android-twa/app/src/main/res/drawable-nodpi/letmefly_logo.png

      - name: Build signed test APK
        working-directory: android-twa
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK certificate
        run: |
          APK='android-twa/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -Fq '5a4162c5c41375211aa5761ee6bbfaff00d9d542e61c5b9cd3e1c2cc48255343'
          cp "$APK" LetMeFly-test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LetMeFly-test-apk
          path: LetMeFly-test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-test >/dev/null 2>&1; then
            gh release create android-test \
              --title 'LetMeFly Android Test' \
              --notes 'Direct-install Galaxy test build. Test signing only; not the future Google Play signing identity.' \
              --prerelease
          fi
          gh release upload android-test LetMeFly-test.apk --clobber
