name: Desktop Shell Navigation Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/desktop-nav-shell-2026-09-15]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-shell-nav-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  desktop-shell-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Build exact production assembly without deploying
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/lmf-build.sh"
          import pathlib,tomllib
          print('set -euo pipefail')
          print(tomllib.loads(pathlib.Path('netlify.toml').read_text())['build']['command'])
          PY
          bash "$RUNNER_TEMP/lmf-build.sh"
      - name: Install isolated browser harness dependency
        shell: bash
        run: |
          set -euo pipefail
          cd .build-src/letmefly_app
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Prove compact desktop rail and phone isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .build-src/letmefly_app/dist >"$RUNNER_TEMP/desktop-shell-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          export LMF_AUDIT_BASE_URL="http://127.0.0.1:4173"
          node ci/audit-desktop-shell-nav-v1.mjs "$PWD/.build-src/letmefly_app"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-shell-nav-${{ github.run_id }}
          path: .build-src/letmefly_app/DESKTOP_SHELL_NAV_AUDIT
          if-no-files-found: warn
          retention-days: 14
