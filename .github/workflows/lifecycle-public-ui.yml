name: Lifecycle Public UI Audit

on:
  workflow_dispatch:
  push:
    branches: [fix/issue65-mobile-load-width]
  pull_request:
    paths:
      - 'overlays/ui-command-v2/**'
      - 'ci/**'
      - '.github/workflows/lifecycle-public-ui.yml'

permissions:
  contents: read

concurrency:
  group: lifecycle-public-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workout-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Build exact production assembly without deploying
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/assembly.sh"
          import pathlib, tomllib
          print('set -euo pipefail')
          print(tomllib.loads(pathlib.Path('netlify.toml').read_text())['build']['command'])
          PY
          bash "$RUNNER_TEMP/assembly.sh"
      - name: Verify real mobile load, round and metric interactions
        shell: bash
        run: |
          set -euo pipefail
          (cd .build-src/letmefly_app && npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0)
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .build-src/letmefly_app/dist >"$RUNNER_TEMP/ui-http.log" 2>&1 &
          UI_SERVER_PID=$!
          trap 'kill "$UI_SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node ci/audit-lifecycle-public-ui.mjs
          git diff --exit-code HEAD -- .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-public-ui-${{ github.run_id }}
          path: .build-src/letmefly_app/LIFECYCLE_PUBLIC_UI_AUDIT
          if-no-files-found: error
          retention-days: 14
