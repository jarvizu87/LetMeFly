name: Maintenance Runtime Load + Bar Loader Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'ci/audit-maintenance-runtime-load-bar-v1.mjs'
      - 'ci/apply-program-card-fidelity-v1.sh'
      - 'ci/audit-program-card-fidelity-v1.mjs'
      - 'ci/audit-athlete-program-progression.mjs'
      - 'ci/build-command-v2-v2-1.sh'
      - 'ci/install-smart-names-bar-loader.sh'
      - 'ci/install-approved-tab-redesigns-v1.sh'
      - 'ci/install-train-bar-loader-bridge-v1.sh'
      - 'overlays/ui-command-v2/batch-v/**'
      - 'overlays/ui-command-v2/batch-ar/**'
      - '.github/workflows/maintenance-runtime-load-bar-audit.yml'

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  maintenance-runtime-load-bar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Build exact PR production candidate
        run: bash ci/build-command-v2-v2-1.sh
      - name: Install Bar Loader and final approved Train bridge
        run: |
          bash ci/install-smart-names-bar-loader.sh
          bash ci/install-approved-tab-redesigns-v1.sh
      - name: Install isolated browser harness dependency
        working-directory: .build-src/letmefly_app
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Run Maintenance resolved-load and Bar Loader audit
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          node ci/audit-maintenance-runtime-load-bar-v1.mjs .build-src/letmefly_app
      - name: Publish runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-runtime-load-bar-${{ github.run_id }}
          path: .build-src/letmefly_app/MAINTENANCE_RUNTIME_LOAD_BAR_AUDIT.json
          if-no-files-found: warn
          retention-days: 14