name: Maintenance Runtime Load + Bar Loader Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'ci/audit-maintenance-runtime-load-bar-v1.mjs'
      - 'ci/apply-program-card-fidelity-v1.sh'
      - 'ci/audit-program-card-fidelity-v1.mjs'
      - 'ci/audit-athlete-program-progression.mjs'
      - 'ci/build-command-v2-v2-1.sh'
      - 'ci/install-*.sh'
      - 'overlays/ui-command-v2/**'
      - '.github/workflows/maintenance-runtime-load-bar-audit.yml'

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  maintenance-runtime-load-bar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Build exact PR production candidate
        run: bash ci/build-command-v2-v2-1.sh
      - name: Install exact Netlify production UI stack
        run: |
          bash ci/install-smart-names-bar-loader.sh
          bash ci/install-exercise-intelligence-v1.sh
          bash ci/install-exercise-intelligence-v2-supplement.sh
          bash ci/install-exercise-intelligence-active-program-coverage-v1.sh
          bash ci/install-exercise-intelligence-program-name-coverage-v1.sh
          node ci/audit-exercise-intelligence-program-name-resolution.mjs .build-src/letmefly_app
          bash ci/install-exercise-intelligence-library-v1.sh
          bash ci/install-exercise-intelligence-coach-v1.sh
          bash ci/install-exercise-intelligence-coach-substitutions-v1.sh
          bash ci/install-exercise-intelligence-substitutions-v1.sh
          bash ci/install-voice-notes-v2.sh
          bash ci/install-strength-maxes-v1.sh
          bash ci/install-progress-dashboard-v1.sh
          bash ci/install-progress-tab-scroll-safety-v1.sh
          bash ci/install-progress-conditioning-v4.sh
          bash ci/install-athlete-insights-v1.sh
          bash ci/install-workout-recap-v1.sh
          bash ci/install-command-refresh.sh
          bash ci/install-mobile-recording-regression-v1.sh
          bash ci/install-home-command-hero-v1.sh
          bash ci/install-home-reference-v3.sh
          bash ci/install-home-progress-route-isolation-v1.sh
          bash ci/install-home-main-option1-v1.sh
          bash ci/install-profile-v2.sh
          bash ci/install-workout-logging-v2.sh
          bash ci/install-official-brand-v2.sh
          bash ci/install-desktop-workspace-v1.sh
          bash ci/install-more-workspace-v1.sh
          node ci/audit-more-workspace-v1.mjs .build-src/letmefly_app
          bash ci/install-approved-tab-redesigns-v1.sh
          node ci/audit-approved-tab-redesigns-v1.mjs .build-src/letmefly_app
          bash ci/install-color-harmonization-v1.sh
          node ci/audit-color-harmonization-v1.mjs .build-src/letmefly_app
          bash ci/install-locked-art-fidelity-v1.sh
          node ci/audit-locked-art-fidelity-v1.mjs .build-src/letmefly_app
          node ci/audit-official-brand-v2.mjs .build-src/letmefly_app
          bash ci/install-crownforge-circuit-train-v1.sh
          node ci/audit-crownforge-circuit-train-v1.mjs .build-src/letmefly_app
      - name: Install isolated browser harness dependency
        working-directory: .build-src/letmefly_app
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Run Maintenance resolved-load and Bar Loader audit
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          node ci/audit-maintenance-runtime-load-bar-v1.mjs .build-src/letmefly_app
      - name: Publish runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-runtime-load-bar-${{ github.run_id }}
          path: .build-src/letmefly_app/MAINTENANCE_RUNTIME_LOAD_BAR_AUDIT.json
          if-no-files-found: warn
          retention-days: 14