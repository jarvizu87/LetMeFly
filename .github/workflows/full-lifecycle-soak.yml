name: LetMeFly Full Lifecycle Soak

on:
  workflow_dispatch:
    inputs:
      passes:
        description: Complete Crownforge -> Crown Maintenance -> Black Crown lifecycles
        required: false
        default: '5'
  push:
    branches:
      - qa/full-lifecycle-soak
    paths:
      - '.github/workflows/full-lifecycle-soak.yml'
      - 'ci/audit-full-lifecycle-soak-v2.mjs'
      - 'ci/audit-lifecycle-load-carry-v1.mjs'
      - 'ci/report-lifecycle-api-surface.mjs'
      - 'ci/build-command-v2-v2-1.sh'
      - 'ci/apply-athlete-program-progression-v1.sh'
      - 'ci/apply-workout-prescription-fidelity-v1.sh'
      - 'ci/normalize-workout-prescription-fidelity-source-v1.sh'

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout isolated QA branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Syntax-check soak harness
        run: |
          node --check ci/audit-full-lifecycle-soak-v2.mjs
          node --check ci/audit-lifecycle-load-carry-v1.mjs
          node --check ci/report-lifecycle-api-surface.mjs

      - name: Audit real-program workout flow edge cases
        run: node ci/audit-workout-flow-edge-cases.mjs

      - name: Reconstruct exact production source
        run: bash ci/build-command-v2-v2-1.sh

      - name: Audit reconstructed workout persistence source
        run: node ci/audit-workout-persistence-source.mjs .build-src/letmefly_app

      - name: Install production post-build runtime layers
        run: |
          bash ci/install-smart-names-bar-loader.sh
          bash ci/install-exercise-intelligence-v1.sh
          bash ci/install-exercise-intelligence-v2-supplement.sh
          bash ci/install-exercise-intelligence-active-program-coverage-v1.sh
          bash ci/install-exercise-intelligence-program-name-coverage-v1.sh
          node ci/audit-exercise-intelligence-program-name-resolution.mjs .build-src/letmefly_app
          bash ci/install-exercise-intelligence-library-v1.sh
          bash ci/install-exercise-intelligence-coach-v1.sh
          bash ci/install-exercise-intelligence-coach-substitutions-v1.sh
          bash ci/install-exercise-intelligence-substitutions-v1.sh
          bash ci/install-voice-notes-v2.sh
          bash ci/install-strength-maxes-v1.sh
          bash ci/install-progress-dashboard-v1.sh
          bash ci/install-progress-tab-scroll-safety-v1.sh
          bash ci/install-progress-conditioning-v4.sh
          bash ci/install-command-refresh.sh
          bash ci/install-mobile-recording-regression-v1.sh
          bash ci/install-home-command-hero-v1.sh
          bash ci/install-home-reference-v3.sh
          bash ci/install-home-progress-route-isolation-v1.sh
          bash ci/install-home-main-option1-v1.sh
          bash ci/install-profile-v2.sh
          bash ci/install-workout-logging-v2.sh
          bash ci/install-official-brand-v2.sh
          bash ci/install-desktop-workspace-v1.sh

      - name: Audit finished production assembly baseline
        run: |
          node ci/audit-official-brand-v2.mjs .build-src/letmefly_app
          node ci/audit-full-app-cycle-v2.mjs .build-src/letmefly_app
          node ci/audit-athlete-program-progression.mjs .build-src/letmefly_app
          node ci/audit-workout-prescription-fidelity-v1.mjs .build-src/letmefly_app

      - name: Report real lifecycle service API surface
        run: node ci/report-lifecycle-api-surface.mjs .build-src/letmefly_app

      - name: Run repeated full athlete lifecycle soak
        run: |
          PASSES="${{ github.event.inputs.passes }}"
          if [[ -z "$PASSES" ]]; then PASSES=5; fi
          node ci/audit-full-lifecycle-soak-v2.mjs .build-src/letmefly_app "$PASSES"

      - name: Audit long-horizon load carry matrix
        run: node ci/audit-lifecycle-load-carry-v1.mjs .build-src/letmefly_app

      - name: Publish lifecycle soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: letmefly-full-lifecycle-soak
          path: |
            .build-src/letmefly_app/FULL_LIFECYCLE_SOAK_AUDIT.json
            .build-src/letmefly_app/FULL_LIFECYCLE_SOAK_AUDIT.md
            .build-src/letmefly_app/FULL_APP_CYCLE_AUDIT.json
            .build-src/letmefly_app/FULL_APP_CYCLE_AUDIT.md
            .build-src/letmefly_app/LIFECYCLE_LOAD_CARRY_AUDIT.json
            .build-src/letmefly_app/LIFECYCLE_LOAD_CARRY_AUDIT.md
            .build-src/letmefly_app/LIFECYCLE_API_SURFACE.json
            .build-src/letmefly_app/LIFECYCLE_API_SURFACE.md
            .build-src/letmefly_app/WORKOUT_PERSISTENCE_SOURCE_AUDIT.md
          if-no-files-found: warn
          retention-days: 14
