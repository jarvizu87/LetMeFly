name: Black Crown Sync Main

on:
  push:
    branches:
      - black-crown-v2-0-modular-import
    paths:
      - '.github/workflows/black-crown-sync-main.yml'

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: black-crown-v2-0-modular-import
          fetch-depth: 0

      - name: Merge latest main and trigger final regressions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          git merge --no-commit --no-ff origin/main
          rm -f .github/workflows/black-crown-sync-main.yml
          printf '\nSynchronized with main `%s` before final PR validation.\n' "$MAIN_SHA" >> overlays/program-data/black-crown-v2-0/FINALIZATION.md
          git add -A
          git commit -m 'Sync latest main into Black Crown v2 integration'
          git push origin HEAD:black-crown-v2-0-modular-import
