name: Black Crown Source Weeks Export

on:
  push:
    branches:
      - black-crown-v2-0-modular-import
    paths:
      - .github/workflows/black-crown-source-weeks-export.yml

permissions:
  contents: write

jobs:
  export-source-weeks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct immutable source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build-src
          mkdir -p .build-src
          unzip -q source/LETMEFLY_REBUILT_SOURCE_V5_4_UI_COMMAND_B4.zip -d .build-src
          cd .build-src/letmefly_app
          sha256sum -c MANIFEST.sha256

      - name: Apply Crownforge modular package
        shell: bash
        run: bash ci/apply-crownforge-v2-1.sh "$GITHUB_WORKSPACE/.build-src/letmefly_app"

      - name: Apply Black Crown source staging
        shell: bash
        run: bash ci/apply-black-crown-v2-0.sh "$GITHUB_WORKSPACE/.build-src/letmefly_app"

      - name: Export decoded canonical source weeks
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.build-src/letmefly_app/src/programs/black-crown/source-weeks"
          OUT="$GITHUB_WORKSPACE/overlays/program-data/black-crown-v2-0/diagnostics/source-weeks"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$SRC"/week-*.ts "$OUT"/
          cp "$SRC/index.ts" "$OUT/index.ts"

      - name: Commit decoded source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add overlays/program-data/black-crown-v2-0/diagnostics/source-weeks
          git commit -m 'Export decoded Black Crown v2 source weeks'
          git push origin HEAD:black-crown-v2-0-modular-import
