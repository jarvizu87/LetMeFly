name: Workout Persistence Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Reconstruct governed production source
        run: bash ci/build-command-v2-v2-1.sh

      - name: Expose authoritative workout persistence source
        run: node ci/audit-workout-persistence-source.mjs .build-src/letmefly_app

      - name: Publish persistence source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workout-persistence-source-diagnostic
          path: .build-src/letmefly_app/WORKOUT_PERSISTENCE_SOURCE_AUDIT.md
          if-no-files-found: error
          retention-days: 3
