name: Black Crown v2.1 Production Audit

on:
  push:
    branches:
      - main
      - black-crown-v2-1-glute-specialization
    paths:
      - 'ci/build-command-v2.sh'
      - 'ci/build-command-v2-hardening.sh'
      - 'ci/build-command-v2-cloudinary.sh'
      - 'ci/build-command-v2-v2-1.sh'
      - 'ci/command-v2-program-compat.sh'
      - 'ci/apply-black-crown-v2-0.sh'
      - 'ci/apply-black-crown-v2-1.sh'
      - 'ci/apply-black-crown-workout-support.sh'
      - 'ci/apply-black-crown-command-v2-core.sh'
      - 'ci/apply-black-crown-command-v2.sh'
      - 'ci/generate-black-crown-runtime.mjs'
      - 'ci/audit-black-crown-runtime.mjs'
      - 'ci/audit-black-crown-v2-1.mjs'
      - 'ci/install-exercise-intelligence-v2-supplement.sh'
      - 'overlays/program-data/black-crown-v2-0/**'
      - 'overlays/program-data/black-crown-v2-1/**'
      - 'overlays/exercise-intelligence/black-crown-v2-1-supplement.json'
      - 'overlays/exercise-intelligence/runtime/exercise-intelligence-runtime-v1.js'
      - 'netlify.toml'
      - '.github/workflows/black-crown-v2-production-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ci/build-command-v2.sh'
      - 'ci/build-command-v2-hardening.sh'
      - 'ci/build-command-v2-cloudinary.sh'
      - 'ci/build-command-v2-v2-1.sh'
      - 'ci/command-v2-program-compat.sh'
      - 'ci/apply-black-crown-v2-0.sh'
      - 'ci/apply-black-crown-v2-1.sh'
      - 'ci/apply-black-crown-workout-support.sh'
      - 'ci/apply-black-crown-command-v2-core.sh'
      - 'ci/apply-black-crown-command-v2.sh'
      - 'ci/generate-black-crown-runtime.mjs'
      - 'ci/audit-black-crown-runtime.mjs'
      - 'ci/audit-black-crown-v2-1.mjs'
      - 'ci/install-exercise-intelligence-v2-supplement.sh'
      - 'overlays/program-data/black-crown-v2-0/**'
      - 'overlays/program-data/black-crown-v2-1/**'
      - 'overlays/exercise-intelligence/black-crown-v2-1-supplement.json'
      - 'overlays/exercise-intelligence/runtime/exercise-intelligence-runtime-v1.js'
      - 'netlify.toml'
      - '.github/workflows/black-crown-v2-production-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Build and audit Command V2 with Black Crown v2.1
        run: bash ci/build-command-v2-v2-1.sh

      - name: Re-audit active Black Crown v2.1 after UI overlays
        run: |
          node ci/audit-black-crown-runtime.mjs "$GITHUB_WORKSPACE/.build-src/letmefly_app"
          node ci/audit-black-crown-v2-1.mjs "$GITHUB_WORKSPACE/.build-src/letmefly_app"

      - name: Protect Crownforge and package architecture
        working-directory: .build-src/letmefly_app
        run: |
          npm run audit:crownforge
          npm run audit:exercise-library
          npm run audit:source
          npm run typecheck
          npm run build

      - name: Install and verify Exercise Intelligence v2.1 supplement
        run: |
          bash ci/install-exercise-intelligence-v1.sh "$GITHUB_WORKSPACE/.build-src/letmefly_app/dist"
          bash ci/install-exercise-intelligence-v2-supplement.sh "$GITHUB_WORKSPACE/.build-src/letmefly_app/dist"

      - name: Confirm production package
        run: |
          set -euo pipefail
          test -f .build-src/letmefly_app/dist/index.html
          grep -Rq 'Black Crown Revised' .build-src/letmefly_app/dist/assets
          grep -Rq 'v2.1' .build-src/letmefly_app/dist/assets
          grep -Rq 'Machine Hip Abduction' .build-src/letmefly_app/dist/assets
          grep -Fq 'machine-hip-abduction' .build-src/letmefly_app/dist/data/exercise-intelligence-v1.json
          echo 'Black Crown v2.1 production integration: PASS'
