name: Crownforge Program Shape Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reconstruct through modular Batch C
        run: |
          set -euo pipefail
          ROOT="$PWD"
          unzip -q source/LETMEFLY_REBUILT_SOURCE_V5_4_UI_COMMAND_B4.zip -d /tmp/lmfdiag
          TARGET=/tmp/lmfdiag/letmefly_app
          bash ci/apply-crownforge-v2-1.sh "$TARGET"
          bash ci/command-v2-program-compat.sh pre "$TARGET"
          cat overlays/ui-command-v2/command-v2.patch.* > /tmp/command-v2.patch
          cd "$TARGET"
          patch -p0 < /tmp/command-v2.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.ts'); t=p.read_text()
          old='<div class="page-kicker">Identity</div><h2>Athlete Profile</h2></div><span class="badge mandatory">Private</span>'
          new='<div class="page-kicker">Identity</div><h2>Athlete Profile</h2></div><span class="badge mandatory">__LMF_PROFILE_PRIVATE__</span>'
          p.write_text(t.replace(old,new,1))
          PY
          bash "$ROOT/ci/modular-command-v2-batch-c.sh" "$TARGET"
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.ts'); t=p.read_text(); p.write_text(t.replace('<span class="badge mandatory">__LMF_PROFILE_PRIVATE__</span>','<span class="badge mandatory">Private</span>',1))
          PY
          echo '===== EXERCISES / COACH SHAPE ====='
          grep -n -A 34 -B 4 'function exercisesPage' src/main.ts
          echo '===== END EXERCISES / COACH SHAPE ====='
