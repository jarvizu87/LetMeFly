name: Crownforge Source Diagnostic

on:
  push:
    branches: [crownforge-v2-1-audit-continuation]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract immutable source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .diag-src
          mkdir -p .diag-src
          unzip -q source/LETMEFLY_REBUILT_SOURCE_V5_4_UI_COMMAND_B4.zip -d .diag-src
          cd .diag-src/letmefly_app
          echo '=== PACKAGE ==='
          cat package.json
          echo '=== RELEVANT FILES ==='
          find scripts src -type f | sort | grep -Ei 'crownforge|maintenance|program|exercise|type' || true
      - name: Upload reconstructed app source
        uses: actions/upload-artifact@v4
        with:
          name: crownforge-base-source
          path: .diag-src/letmefly_app
          if-no-files-found: error
          retention-days: 1
