name: Black Crown Runtime Inspect

on:
  push:
    branches:
      - black-crown-v2-0-modular-import
    paths:
      - .github/workflows/black-crown-runtime-inspect.yml

permissions:
  contents: write

jobs:
  export-runtime-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct immutable source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='source/LETMEFLY_REBUILT_SOURCE_V5_4_UI_COMMAND_B4.zip'
          rm -rf .build-src
          mkdir -p .build-src
          unzip -q "$ARCHIVE" -d .build-src
          cd .build-src/letmefly_app
          sha256sum -c MANIFEST.sha256

      - name: Apply Crownforge modular package
        shell: bash
        run: bash ci/apply-crownforge-v2-1.sh "$GITHUB_WORKSPACE/.build-src/letmefly_app"

      - name: Apply Black Crown source staging
        shell: bash
        run: bash ci/apply-black-crown-v2-0.sh "$GITHUB_WORKSPACE/.build-src/letmefly_app"

      - name: Export runtime architecture files
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.build-src/letmefly_app"
          OUT="$GITHUB_WORKSPACE/overlays/program-data/black-crown-v2-0/diagnostics/runtime-shape"
          rm -rf "$OUT"
          mkdir -p "$OUT/src/program-engine" "$OUT/src/programs/black-crown" "$OUT/src/programs" "$OUT/src/data" "$OUT/src/services"
          cp "$SRC/src/program-engine/types.ts" "$OUT/src/program-engine/types.ts"
          cp "$SRC/src/program-engine/builders.ts" "$OUT/src/program-engine/builders.ts"
          cp "$SRC/src/programs/black-crown/index.ts" "$OUT/src/programs/black-crown/index.ts"
          cp "$SRC/src/programs/black-crown/metadata.ts" "$OUT/src/programs/black-crown/metadata.ts"
          cp "$SRC/src/programs/black-crown/rules.ts" "$OUT/src/programs/black-crown/rules.ts"
          cp "$SRC/src/programs/registry.ts" "$OUT/src/programs/registry.ts"
          cp "$SRC/src/data/programs.ts" "$OUT/src/data/programs.ts"
          cp "$SRC/src/services/workout-service.ts" "$OUT/src/services/workout-service.ts"
          cp "$SRC/src/data/exercise-library.ts" "$OUT/src/data/exercise-library.ts"

      - name: Commit runtime architecture snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add overlays/program-data/black-crown-v2-0/diagnostics/runtime-shape
          if git diff --cached --quiet; then
            echo 'No runtime-shape changes to commit.'
            exit 0
          fi
          git commit -m 'Export Black Crown runtime architecture shape'
          git push origin HEAD:black-crown-v2-0-modular-import
