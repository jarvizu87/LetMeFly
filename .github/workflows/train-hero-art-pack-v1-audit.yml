name: Train Hero Art Pack V1 Audit

on:
  pull_request:
    paths:
      - 'overlays/ui-command-v2/static/train-heroes-v1/**'
      - 'overlays/ui-command-v2/batch-av/**'
      - 'docs/TRAIN_HERO_ART_PACK_V1_LOCKED.md'
      - 'docs/TRAIN_HERO_RUNTIME_WIRING_PLAN_V1.md'
      - 'ci/validate-train-hero-art-pack-v1.mjs'
      - 'ci/install-train-hero-runtime-v1.sh'
      - 'ci/audit-train-hero-runtime-v1.mjs'
      - 'ci/audit-train-hero-day4-browser-v1.mjs'
      - 'netlify.toml'
      - '.github/workflows/train-hero-art-pack-v1-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'overlays/ui-command-v2/static/train-heroes-v1/**'
      - 'overlays/ui-command-v2/batch-av/**'
      - 'docs/TRAIN_HERO_ART_PACK_V1_LOCKED.md'
      - 'docs/TRAIN_HERO_RUNTIME_WIRING_PLAN_V1.md'
      - 'ci/validate-train-hero-art-pack-v1.mjs'
      - 'ci/install-train-hero-runtime-v1.sh'
      - 'ci/audit-train-hero-runtime-v1.mjs'
      - 'ci/audit-train-hero-day4-browser-v1.mjs'
      - 'netlify.toml'
      - '.github/workflows/train-hero-art-pack-v1-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-train-hero-pack-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate locked hero manifest
        run: node ci/validate-train-hero-art-pack-v1.mjs

      - name: Validate deterministic runtime selector
        run: node ci/audit-train-hero-runtime-v1.mjs

  browser-day4-train-hero-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Build exact Netlify production assembly without deployment
        run: |
          python3 - <<'PY'
          import subprocess, tomllib
          with open('netlify.toml','rb') as f:
              command=tomllib.load(f)['build']['command']
          subprocess.run(command,shell=True,check=True,executable='/bin/bash')
          PY

      - name: Install isolated browser harness dependency
        run: npm install --prefix .build-src/letmefly_app --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0

      - name: Audit Day 1 to Day 4 dynamic Train hero in mobile and desktop browsers
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .build-src/letmefly_app/dist >/tmp/letmefly-train-hero-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          node ci/audit-train-hero-day4-browser-v1.mjs

      - name: Publish Day 4 Train hero evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-hero-day4-browser-audit
          path: .build-src/letmefly_app/TRAIN_HERO_DAY4_BROWSER_AUDIT
          retention-days: 14
          if-no-files-found: warn
