name: Progression Shadow Current-Main Audit

on:
  pull_request:
    paths:
      - 'netlify.toml'
      - 'ci/apply-skip-day-v1.sh'
      - 'ci/audit-skip-day-v1.mjs'
      - 'ci/apply-unskip-day-v1.sh'
      - 'ci/audit-unskip-day-v1.mjs'
      - 'ci/apply-progression-shadow-current-v1.sh'
      - 'ci/audit-progression-shadow-current-v1.mjs'
      - 'ci/apply-progression-shadow-review-engine-v2.sh'
      - 'ci/audit-progression-shadow-review-engine-v2.mjs'
      - 'ci/inspect-progression-shadow-stage3-contracts.mjs'
      - 'ci/apply-progression-shadow-read-adapter-v3.sh'
      - 'ci/audit-progression-shadow-read-adapter-v3.mjs'
      - 'ci/apply-progression-shadow-pilot-journal-v4.sh'
      - 'ci/audit-progression-shadow-pilot-journal-v4.mjs'
      - 'ci/apply-progression-shadow-provenance-review-v5.sh'
      - 'ci/audit-progression-shadow-provenance-review-v5.mjs'
      - 'ci/apply-progression-shadow-pilot-operations-v6.sh'
      - 'ci/audit-progression-shadow-pilot-operations-v6.mjs'
      - 'ci/apply-progression-shadow-restore-authorization-v7.sh'
      - 'ci/audit-progression-shadow-restore-authorization-v7.mjs'
      - 'ci/apply-progression-shadow-hidden-pilot-integration.sh'
      - 'ci/audit-progression-shadow-hidden-pilot-integration.mjs'
      - 'ci/audit-progression-shadow-production-wiring.mjs'
      - 'docs/PROGRESSION_SHADOW_CURRENT_MAIN.md'
      - '.github/workflows/progression-shadow-current-main-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progression-shadow-current-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Audit production Netlify Shadow wiring
        run: node ci/audit-progression-shadow-production-wiring.mjs netlify.toml

      - name: Reconstruct exact current production source
        run: bash ci/build-command-v2-v2-1.sh

      - name: Apply governed Skip Day before Shadow
        run: bash ci/apply-skip-day-v1.sh .build-src/letmefly_app

      - name: Apply governed Unskip Day before Shadow
        run: bash ci/apply-unskip-day-v1.sh .build-src/letmefly_app

      - name: Inspect current Stage-3 data contracts
        run: node ci/inspect-progression-shadow-stage3-contracts.mjs .build-src/letmefly_app

      - name: Apply hidden current-main Shadow pilot foundation
        run: bash ci/apply-progression-shadow-current-v1.sh .build-src/letmefly_app

      - name: Audit Shadow authority and fail-open boundaries
        run: node ci/audit-progression-shadow-current-v1.mjs .build-src/letmefly_app

      - name: Apply Stage-2 pure review engine
        run: bash ci/apply-progression-shadow-review-engine-v2.sh .build-src/letmefly_app

      - name: Audit Green Yellow Red evidence rules and pilot gates
        run: node --experimental-strip-types ci/audit-progression-shadow-review-engine-v2.mjs .build-src/letmefly_app

      - name: Apply Stage-3 read-only canonical-data adapter
        run: bash ci/apply-progression-shadow-read-adapter-v3.sh .build-src/letmefly_app

      - name: Audit Stage-3 real-workout evidence mapping
        run: node --experimental-strip-types ci/audit-progression-shadow-read-adapter-v3.mjs .build-src/letmefly_app

      - name: Apply Stage-4 append-only pilot journal
        run: bash ci/apply-progression-shadow-pilot-journal-v4.sh .build-src/letmefly_app

      - name: Install ephemeral IndexedDB test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts fake-indexeddb@6.2.5

      - name: Audit Stage-4 original-hook receipt persistence
        run: node --experimental-strip-types ci/audit-progression-shadow-pilot-journal-v4.mjs .build-src/letmefly_app

      - name: Apply Stage-5 immutable provenance and human-review ledger
        run: bash ci/apply-progression-shadow-provenance-review-v5.sh .build-src/letmefly_app

      - name: Audit Stage-5 provenance and human-review evidence
        run: node --experimental-strip-types ci/audit-progression-shadow-provenance-review-v5.mjs .build-src/letmefly_app

      - name: Apply Stage-6 pilot operations hardening
        run: bash ci/apply-progression-shadow-pilot-operations-v6.sh .build-src/letmefly_app

      - name: Audit Stage-6 dispositions replacements backlog and export
        run: node --experimental-strip-types ci/audit-progression-shadow-pilot-operations-v6.mjs .build-src/letmefly_app

      - name: Apply Stage-7 verified restore and operator authorization boundary
        run: bash ci/apply-progression-shadow-restore-authorization-v7.sh .build-src/letmefly_app

      - name: Audit Stage-7 restore round trip and authorization boundary
        run: node --experimental-strip-types ci/audit-progression-shadow-restore-authorization-v7.mjs .build-src/letmefly_app

      - name: Apply hidden real-workout pilot integration boundary
        run: bash ci/apply-progression-shadow-hidden-pilot-integration.sh .build-src/letmefly_app

      - name: Audit hidden real-workout pilot integration boundary
        run: node ci/audit-progression-shadow-hidden-pilot-integration.mjs .build-src/letmefly_app

      - name: Typecheck Shadow against final reconstructed source
        run: npm --prefix .build-src/letmefly_app run typecheck

      - name: Build Shadow candidate
        run: npm --prefix .build-src/letmefly_app run build

      - name: Confirm Crownstorm remains absent from candidate source
        run: |
          set -euo pipefail
          ! grep -R -i "crownstorm\|main quest" .build-src/letmefly_app/src

      - name: Confirm no privileged secrets entered candidate
        run: |
          set -euo pipefail
          ! grep -R "service_role\|SUPABASE_SERVICE\|DATABASE_PASSWORD" .build-src/letmefly_app/dist
