name: Crownforge Full Source Audit Export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact current Crownforge source
        run: |
          set -euo pipefail
          ARCHIVE="source/LETMEFLY_REBUILT_SOURCE_V5_4_UI_COMMAND_B4.zip"
          rm -rf .audit-src crownforge-source-audit
          mkdir -p .audit-src crownforge-source-audit
          unzip -q "$ARCHIVE" -d .audit-src
          (cd .audit-src/letmefly_app && sha256sum -c MANIFEST.sha256)
          bash ci/apply-crownforge-v2-1.sh "$GITHUB_WORKSPACE/.audit-src/letmefly_app"
          cp -R .audit-src/letmefly_app/src/program-engine crownforge-source-audit/
          cp -R .audit-src/letmefly_app/src/programs crownforge-source-audit/
          mkdir -p crownforge-source-audit/src-data crownforge-source-audit/scripts
          cp .audit-src/letmefly_app/src/data/programs.ts crownforge-source-audit/src-data/programs.ts
          cp .audit-src/letmefly_app/scripts/audit-crownforge-full.mjs crownforge-source-audit/scripts/
          cp .audit-src/letmefly_app/package.json crownforge-source-audit/

      - name: Publish exact reconstructed program source
        uses: actions/upload-artifact@v4
        with:
          name: crownforge-full-current-source
          path: crownforge-source-audit
          if-no-files-found: error
          retention-days: 1
