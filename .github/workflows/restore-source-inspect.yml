name: LetMeFly Restore Source Inspect

on:
  push:
    branches: [hardening/account-device-sync-v1]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source only
        run: |
          rm -rf .restore-inspect
          mkdir -p .restore-inspect
          unzip -q source/LETMEFLY_REBUILT_SOURCE_V5_4_UI_COMMAND_B4.zip -d .restore-inspect
      - name: Print restore integration points
        run: |
          MAIN="$(find .restore-inspect -path '*/src/main.ts' -print -quit)"
          test -n "$MAIN"
          APP_ROOT="${MAIN%/src/main.ts}"
          echo "APP_ROOT=$APP_ROOT"
          echo '--- main.ts restore/backup lines ---'
          grep -nEi 'restore|backup|data & backup|import' "$MAIN" | head -140 || true
          echo '--- restore-service.ts ---'
          sed -n '1,320p' "$APP_ROOT/src/restore/restore-service.ts"
          echo '--- restore-types.ts ---'
          sed -n '1,260p' "$APP_ROOT/src/restore/restore-types.ts"
