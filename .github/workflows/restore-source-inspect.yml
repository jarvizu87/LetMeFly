name: LetMeFly Restore Source Inspect

on:
  push:
    branches: [hardening/account-device-sync-v1]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source only
        run: |
          rm -rf .restore-inspect
          mkdir -p .restore-inspect
          unzip -q source/LETMEFLY_REBUILT_SOURCE_V5_4_UI_COMMAND_B4.zip -d .restore-inspect
      - name: Print onboarding and restore integration points
        run: |
          MAIN="$(find .restore-inspect -path '*/src/main.ts' -print -quit)"
          test -n "$MAIN"
          APP_ROOT="${MAIN%/src/main.ts}"
          echo "APP_ROOT=$APP_ROOT"
          echo '--- onboarding markers ---'
          grep -nEi 'BUILD THE ATHLETE VAULT|CREATE LOCAL ATHLETE|create-local-athlete|onboard|athlete vault' "$MAIN" | head -80 || true
          echo '--- opening source window ---'
          sed -n '40,180p' "$MAIN"
          echo '--- restore handler + binding ---'
          sed -n '620,835p' "$MAIN"
          echo '--- restore-service exports ---'
          sed -n '1,150p' "$APP_ROOT/src/restore/restore-service.ts"
