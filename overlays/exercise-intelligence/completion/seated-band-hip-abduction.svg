    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="480" cy="285" r="245" fill="none" stroke="#6c38a8" stroke-opacity=".18" stroke-width="2"/>
  <g fill="none" stroke="#d7dce5" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
