    <path d="M480 340l-120 66"/>
    <path d="M480 340l120 66"/>
    <path d="M360 406l-28 118"/>
    <path d="M600 406l28 118"/>
  </g>
  <g stroke="#75808e" stroke-width="16" stroke-linecap="round">
