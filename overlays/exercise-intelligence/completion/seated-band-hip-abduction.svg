    <path d="M616 356v182"/>
  </g>
  <path d="M355 383Q480 430 605 383" fill="none" stroke="url(#band)" stroke-width="28" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#b56cff" filter="url(#glow)">
    <path d="M326 396l-58-28 16 32-34 10 60 24z"/>
    <path d="M634 396l58-28-16 32 34 10-60 24z"/>
