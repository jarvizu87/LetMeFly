<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07080a" />
  <title>LetMeFly — Refreshing</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07080a;color:#f5f7fa}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 18%,rgba(170,20,35,.22),transparent 34%),#07080a}
    main{width:min(460px,100%);padding:28px;border:1px solid #2c3138;border-radius:20px;background:rgba(15,17,20,.96);box-shadow:0 24px 80px rgba(0,0,0,.45)}
    .mark{font-size:12px;letter-spacing:.28em;color:#ff3548;font-weight:800}
    h1{margin:10px 0 8px;font-size:30px;letter-spacing:.02em}
    p{margin:0;color:#aeb4bc;line-height:1.55}
    .status{margin-top:22px;padding:14px 16px;border-radius:12px;background:#0b0d10;border:1px solid #242930;font-size:14px;color:#d8dde4}
    .spinner{display:inline-block;width:14px;height:14px;margin-right:9px;border:2px solid #4a5059;border-top-color:#ff3548;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <div class="mark">LETMEFLY COMMAND V2</div>
    <h1>Refreshing the app shell</h1>
    <p>Your profile, workout history, and other athlete data are not being deleted. This only removes obsolete cached app files and service workers.</p>
    <div class="status" id="status"><span class="spinner"></span>Preparing the new Command UI…</div>
  </main>
  <script src="/refresh.js" defer></script>
</body>
</html>
